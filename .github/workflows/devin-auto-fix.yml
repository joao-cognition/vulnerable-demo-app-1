name: Devin Auto-Fix Security Issues

on:
  workflow_run:
    workflows: ["Snyk Security Scan"]
    types: [completed]

permissions:
  contents: read

jobs:
  trigger-devin-fix:
    name: Trigger Devin Batch Sessions
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm install --ignore-scripts 2>/dev/null || true
          npm install -g snyk

      - name: Scan and extract critical vulnerabilities
        id: scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          # Re-run Snyk to get fresh vulnerability data
          snyk test --json > snyk-results.json 2>/dev/null || true

          # Extract unique critical/high vulnerability details
          ISSUES=$(jq -r '
            [.vulnerabilities[]? |
              select(.severity == "critical" or .severity == "high") |
              {title, packageName, version, severity, fixedIn: (.fixedIn[0] // "latest")}
            ] |
            unique_by(.packageName) |
            sort_by(.severity) |
            reverse |
            .[] |
            "[\(.severity | ascii_upcase)] \(.title) in \(.packageName)@\(.version) -> upgrade to \(.fixedIn)"
          ' snyk-results.json 2>/dev/null)

          if [ -z "$ISSUES" ]; then
            echo "No critical/high vulnerabilities found. Skipping Devin trigger."
            echo "has_issues=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_issues=true" >> "$GITHUB_OUTPUT"

          # Count unique affected packages
          PKG_COUNT=$(jq '[.vulnerabilities[]? | select(.severity == "critical" or .severity == "high") | .packageName] | unique | length' snyk-results.json 2>/dev/null || echo "0")
          echo "package_count=$PKG_COUNT" >> "$GITHUB_OUTPUT"

          # Save issues list for the Devin prompts
          echo "$ISSUES" > /tmp/vulnerability-list.txt

          echo "Found $PKG_COUNT vulnerable packages:"
          cat /tmp/vulnerability-list.txt

      - name: Trigger Devin batch sessions
        if: steps.scan.outputs.has_issues == 'true'
        env:
          DEVIN_API_TOKEN: ${{ secrets.DEVIN_API_TOKEN }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          PKG_COUNT: ${{ steps.scan.outputs.package_count }}
        run: |
          ISSUES=$(cat /tmp/vulnerability-list.txt)

          # Helper function to create a Devin session
          create_devin_session() {
            local title="$1"
            local prompt="$2"
            local tags="$3"

            ESCAPED_PROMPT=$(echo "$prompt" | jq -Rs .)

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.devin.ai/v3/organizations/${DEVIN_ORG_ID}/sessions" \
              -H "Authorization: Bearer ${DEVIN_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"prompt\": ${ESCAPED_PROMPT},
                \"repos\": [\"joao-cognition/vulnerable-demo-app-1\"],
                \"title\": \"${title}\",
                \"tags\": ${tags}
              }")

            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              SESSION_URL=$(echo "$BODY" | jq -r '.url // empty')
              SESSION_ID=$(echo "$BODY" | jq -r '.session_id // empty')
              echo "Session created: $title"
              echo "  ID:  $SESSION_ID"
              echo "  URL: $SESSION_URL"
              echo ""
              echo "| $title | \`${SESSION_ID}\` | [View](${SESSION_URL}) |" >> /tmp/session-summary.txt
            else
              echo "::warning::Failed to create session '$title' (HTTP $HTTP_CODE)"
              echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
              echo "| $title | FAILED | HTTP $HTTP_CODE |" >> /tmp/session-summary.txt
            fi
          }

          echo "" > /tmp/session-summary.txt

          # -----------------------------------------------------------
          # Session 1: Fix all security vulnerabilities
          # -----------------------------------------------------------
          read -r -d '' FIX_PROMPT << PROMPT_DELIM || true
          Fix all critical and high security vulnerabilities found by Snyk in this repository.

          Vulnerable packages to fix:

          ${ISSUES}

          Instructions:
          1. Update the vulnerable packages in package.json (root level) to their patched versions
          2. Update packages/app/package.json if any vulnerable packages exist there
          3. Update src/python/requirements.txt if any Python vulnerabilities exist
          4. Run 'npm install' to regenerate the lockfile
          5. Verify the app still starts correctly after updates
          6. Create a single PR with ALL fixes titled: 'fix: resolve ${PKG_COUNT} critical security vulnerabilities (Snyk)'
          7. In the PR description, list each vulnerability that was fixed with before/after versions
          PROMPT_DELIM

          create_devin_session \
            "Auto-fix: ${PKG_COUNT} critical security vulnerabilities" \
            "$FIX_PROMPT" \
            '["auto-fix", "snyk", "security"]'

          # -----------------------------------------------------------
          # Session 2: Update or create documentation
          # -----------------------------------------------------------
          read -r -d '' DOCS_PROMPT << PROMPT_DELIM || true
          Review and update the documentation for this repository. The following security vulnerabilities were recently found by Snyk:

          ${ISSUES}

          Instructions:
          1. Update README.md with proper project documentation including:
             - Project description and purpose
             - Setup and installation instructions
             - Environment variables and configuration
             - Security scanning information (Snyk CI pipeline is configured)
          2. Add a SECURITY.md file if one does not exist, documenting:
             - How to report security vulnerabilities
             - The automated Snyk scanning process
             - Dependency update policy
          3. Add a CONTRIBUTING.md file if one does not exist with contribution guidelines
          4. Ensure all documentation reflects the current state of the project
          5. Create a single PR titled: 'docs: update repository documentation and security policy'
          PROMPT_DELIM

          create_devin_session \
            "Docs: update repository documentation" \
            "$DOCS_PROMPT" \
            '["auto-fix", "documentation", "security"]'

          # -----------------------------------------------------------
          # Session 3: Add test coverage
          # -----------------------------------------------------------
          read -r -d '' TEST_PROMPT << PROMPT_DELIM || true
          Add test coverage to this repository. Currently the project has minimal or no tests.

          The project is a Node.js application (Express-based) with the following structure:
          - src/index.php (PHP utility)
          - src/python/accounts.py (Python database operations)
          - src/services/pusher.js, sentry.js, wait.ts (JavaScript/TypeScript services)
          - src/components/RichText.vue (Vue component)
          - packages/app/ (client-side app)

          Instructions:
          1. Review the existing codebase and identify testable modules
          2. Set up a testing framework (Jest is already a devDependency)
          3. Add unit tests for the JavaScript/TypeScript services in src/services/
          4. Add tests for any utility functions or business logic
          5. Target at least 80% test coverage
          6. Update package.json test script to run the new tests (replace the placeholder)
          7. Ensure all tests pass
          8. Create a single PR titled: 'test: add unit test coverage for core services'
          PROMPT_DELIM

          create_devin_session \
            "Tests: add unit test coverage" \
            "$TEST_PROMPT" \
            '["auto-fix", "testing", "coverage"]'

          # -----------------------------------------------------------
          # Build GitHub Step Summary
          # -----------------------------------------------------------
          echo "## Devin Batch Sessions Triggered" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**${PKG_COUNT}** vulnerable packages detected. Three Devin sessions have been created:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Session | ID | Link |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-----|------|" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/session-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Vulnerabilities Found" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/vulnerability-list.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
